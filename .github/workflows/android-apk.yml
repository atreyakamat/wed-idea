name: Android APK

# Builds a debug APK of the wed-idea Android wrapper (mobile/), which opens the
# live studio site. Run it from the Actions tab (Run workflow) and set WED_IDEA_URL,
# or push a tag like apk-v0.1.0. The APK is attached to the run.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Studio site address, e.g. https://your-studio.netlify.app"
        required: true
        type: string
  push:
    tags: ["apk-v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WED_IDEA_URL: ${{ inputs.site_url || vars.WED_IDEA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install wrapper dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Copy the studio address into the app
        working-directory: mobile
        run: |
          test -n "$WED_IDEA_URL" || { echo "Set the studio address (site_url input or WED_IDEA_URL variable)."; exit 1; }
          npx cap sync android
      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wed-idea-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
