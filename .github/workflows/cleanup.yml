name: Daily clean-up

# Deletes photos 7 days after their gallery closes, and files from uploads
# that never finished. Needs two repository secrets (Settings → Secrets and
# variables → Actions): SITE_URL (e.g. https://app.example.in) and
# CRON_SECRET (the same value as the site's CRON_SECRET setting).
on:
  schedule:
    - cron: "37 21 * * *" # 03:07 IST
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run clean-up
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/cleanup"
