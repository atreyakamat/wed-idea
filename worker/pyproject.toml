[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cwp-worker"
version = "0.1.0"
description = "Uploads and auto-edits a shoot's photos from your computer for Cute Wedding Polaroid."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
cwp-worker = "cwp_worker.cli:main"

[project.gui-scripts]
cwp-worker-app = "cwp_worker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
